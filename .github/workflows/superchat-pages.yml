name: Superchat (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/superchat/**"
      - ".github/workflows/superchat-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/superchat/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/superchat

      - name: Test
        run: npm test
        working-directory: apps/superchat

      - name: Build
        run: npm run build
        working-directory: apps/superchat

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/superchat/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
